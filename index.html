
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Typotheque</title>

    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" href="images/TPTQ.png">

    <!-- Lettertype: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>

<body>

    <nav id="nav">
        <div id="logo">
            <div class="typotheque">TYPOTHEQUE</div>
        </div>

        <div id="menubutton" class="barbutton">
            <img src="images/menu.png" alt="All fonts">
        </div>

        <div id="EmptySpace"></div>

        <div id="login" class="barbutton">Log In</div>

        <div id="search" class="barbutton">
            <img src="images/search.png" alt="Search fonts">
        </div>
    </nav>

    <div id="foto">
        <a>THE 21ST CENTURY NEEDS THIS FONT</a>
    </div>

    <div class="parent">

        <div id="number1" class="boxes">All fonts</div>
        <div id="number2" class="boxes">global fonts</div>
        <div id="number3" class="boxes">superfamilies</div>
        <div id="number4" class="boxes">variable fonts</div>
        <div id="number5" class="boxes">legibility fonts</div>
        <div id="number6" class="boxes">puzzle pieces</div>
        <div id="number7" class="boxes">optical sizes</div>

    </div>

</body>
</html>
